<?xml version="1.0" encoding="utf-8"?>
<!-- 画舫内置示例背景 · 浅色样张（T007 / D36）。
     自产矢量图：纯手写几何＋渐变，无版权、无外部引用、不联网（D90 精神）。
     用途：验证「浅图 → 半透明白遮罩＋文字压深」这条自适应分支；主人可以把自己的图丢进本目录。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde8fb"/>
      <stop offset="0.45" stop-color="#eaf6fd"/>
      <stop offset="1" stop-color="#fdf0f5"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.8" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#fffbe8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9dff3"/>
      <stop offset="1" stop-color="#e9f7fb"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <!-- 远处水面与岸线：画舫在水上，给一条淡 horizon -->
  <path d="M0 690c190-64 330 22 480-26s286-88 438-38 300 88 682 18v356H0z"
        fill="url(#water)" opacity="0.85"/>
  <path d="M0 706c210-40 360 26 520 4s250-56 430-30 280 62 650 30" fill="none"
        stroke="#ffffff" stroke-opacity="0.75" stroke-width="6"/>

  <!-- 云：三层椭圆叠出松软边缘 -->
  <g fill="#ffffff">
    <g opacity="0.92">
      <ellipse cx="250" cy="212" rx="176" ry="58"/>
      <ellipse cx="372" cy="178" rx="126" ry="52"/>
      <ellipse cx="146" cy="184" rx="104" ry="44"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="1180" cy="330" rx="200" ry="60"/>
      <ellipse cx="1300" cy="300" rx="132" ry="50"/>
      <ellipse cx="1070" cy="304" rx="110" ry="42"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="700" cy="120" rx="150" ry="40"/>
      <ellipse cx="800" cy="102" rx="104" ry="34"/>
    </g>
  </g>

  <!-- 樱粉点缀：斜着飘的花瓣（椭圆＋旋转，纯几何） -->
  <g fill="#f7c8dc">
    <ellipse cx="180" cy="96" rx="26" ry="15" transform="rotate(24 180 96)" opacity="0.9"/>
    <ellipse cx="332" cy="392" rx="20" ry="12" transform="rotate(-18 332 392)" opacity="0.8"/>
    <ellipse cx="596" cy="228" rx="16" ry="10" transform="rotate(38 596 228)" opacity="0.7"/>
    <ellipse cx="908" cy="470" rx="24" ry="14" transform="rotate(-32 908 470)" opacity="0.75"/>
    <ellipse cx="1288" cy="128" rx="18" ry="11" transform="rotate(14 1288 128)" opacity="0.85"/>
    <ellipse cx="1452" cy="556" rx="28" ry="16" transform="rotate(-24 1452 556)" opacity="0.7"/>
    <ellipse cx="742" cy="620" rx="15" ry="9" transform="rotate(46 742 620)" opacity="0.6"/>
    <ellipse cx="1044" cy="742" rx="21" ry="12" transform="rotate(-12 1044 742)" opacity="0.55"/>
    <ellipse cx="252" cy="812" rx="18" ry="11" transform="rotate(30 252 812)" opacity="0.5"/>
  </g>

  <!-- 光柱：BA 那种从右上斜切下来的柔光 -->
  <g fill="#ffffff" opacity="0.22">
    <path d="M1180 0l210 0-620 1000-250 0z"/>
    <path d="M1470 0l90 0-430 1000-140 0z"/>
  </g>
</svg>
